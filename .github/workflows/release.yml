name: Release

# Versions come from the commit messages on main (Conventional Commits),
# through release-please.
#
#   Push to main         opens or updates the release PR: next version, changelog
#   Release PR merged    tags the version and publishes the GitHub release, then
#                        builds stable installers, attaches them to it and
#                        points the Homebrew cask at the new macOS installers
#   Manual run           canary installers, kept on the run for testing
#   PR touching the      the same canary build, as a check that packaging
#   packaging files      still works
#
# The builds live in this workflow because a tag created by a workflow does not
# start another one. Hutch can only build for the OS and chip it runs on, so
# each platform needs its own runner.

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - electrobun.config.ts
      - hutch.config.ts
      - hutch.lock
      - dev/fetch-vendor.ts

# A newer push to a PR replaces its build. Runs on main never replace each other.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the "@hutch cli=" pragma at the top of hutch.config.ts.
  HUTCH_VERSION: "0.30.0"

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  build:
    name: Build (${{ matrix.name }})
    needs: release-please
    # Pushes to main build only when they released a version.
    if: ${{ !cancelled() && (needs.release-please.result == 'skipped' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-latest
          # GitHub has said it ends Intel runners in August 2027.
          - name: macOS x64
            runner: macos-26-intel
          - name: Windows x64
            runner: windows-latest
          - name: Linux x64
            runner: ubuntu-latest
    env:
      CHANNEL: ${{ needs.release-please.outputs.release_created == 'true' && 'stable' || 'canary' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Hutch (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh -s -- --version "$HUTCH_VERSION" --no-modify-path
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"

      - name: Install Hutch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1))) -Version $env:HUTCH_VERSION -NoModifyPath
          Join-Path $HOME ".hutch\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: hutch run install

      - name: Build
        run: hutch run ${{ env.CHANNEL == 'stable' && 'build' || 'build:canary' }}

      # Every program and library in the app must run on the runner's chip. A
      # bundled tool built for the other chip would otherwise go unnoticed until
      # someone on that Mac tried it. The DMG holds only a launcher that unpacks
      # the app from the .app.tar.zst on first start, so the check reads that.
      - name: Check the app's binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          app="$(mktemp -d)"
          tar -xf artifacts/*.app.tar.zst -C "$app"
          chip="$(uname -m)"
          wrong=0
          while IFS= read -r file; do
            chips="$(lipo -archs "$file" 2>/dev/null)" || continue
            case " $chips " in
              *" $chip "*) ;;
              *) echo "::error::${file#"$app"/} is built for $chips, not $chip"; wrong=1 ;;
            esac
          done < <(find "$app" -type f)
          exit "$wrong"

      - uses: actions/upload-artifact@v7
        with:
          name: stault-${{ env.CHANNEL }}-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach installers
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # release-please has already published the release with its changelog.
      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          ls -l artifacts
          gh release upload "$TAG" artifacts/* --clobber
          gh release edit "$TAG" --title "Stault $TAG"

  # Writes the cask in MoSattler/homebrew-tap for this release's DMGs, so that
  # `brew install --cask mosattler/tap/stault` and `brew upgrade` get it. The
  # cask is .github/homebrew/stault.rb; this fills in the version and checksums.
  homebrew:
    name: Update the Homebrew cask
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/homebrew

      - uses: actions/download-artifact@v8
        with:
          pattern: stault-stable-macOS-*
          path: artifacts
          merge-multiple: true

      # HOMEBREW_TAP_DEPLOY_KEY is the private half of a deploy key with
      # write access on the tap repository.
      - uses: actions/checkout@v7
        with:
          repository: MoSattler/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Write the cask
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="${TAG#v}"
          arm="$(sha256sum artifacts/macos-arm64-Stault.dmg)"
          intel="$(sha256sum artifacts/macos-x64-Stault.dmg)"
          sed -e "s/@VERSION@/$version/" -e "s/@SHA256_ARM@/${arm%% *}/" -e "s/@SHA256_INTEL@/${intel%% *}/" \
            .github/homebrew/stault.rb > tap/Casks/stault.rb
          cd tap
          # Nothing to commit when the workflow is re-run for the same release.
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "stault $version"
          git push
