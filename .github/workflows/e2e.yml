name: End-to-end tests

# Starts the built app and drives its real window (e2e/), on Linux and on
# Windows, against a GameVault server in Docker. macOS is not covered yet.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a PR replaces its run.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the "@hutch cli=" pragma at the top of hutch.config.ts.
  HUTCH_VERSION: "0.30.0"

jobs:
  linux:
    name: Linux
    # Pinned: from Ubuntu 26.04 on, WebKit's WebDriver is in a package with another name.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install the webview, its WebDriver and a virtual screen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-0 libayatana-appindicator3-1 webkit2gtk-driver xvfb xauth

      # WebKit runs pages in a sandbox built on user namespaces, which Ubuntu
      # 24.04 only lets programs with an AppArmor profile create.
      - name: Let WebKit build its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Hutch
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh -s -- --version "$HUTCH_VERSION" --no-modify-path
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: hutch run install

      - name: Start the test server
        run: ./dev/seed.sh

      # A dev build: a release build refuses to start from the temporary
      # folder WebdriverIO runs its copy of the app from.
      - name: Build the app
        run: hutch run build:dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the tests' packages
        working-directory: e2e
        run: npm ci

      - name: Type-check the tests
        working-directory: e2e
        run: npm run typecheck

      - name: Run the tests
        working-directory: e2e
        run: STAULT_APP="$(echo "$GITHUB_WORKSPACE"/build/dev-*/*/bin/launcher)" npm test

      # A screenshot of the window for every check that failed.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failures-linux
          path: e2e/failures/
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The test server's Docker image is a Linux one, which a Windows runner
      # can only run inside WSL2. WSL stops a distribution 15 s after its last
      # session ends, and the server with it; the tests run from Windows with
      # no session open, so that is turned off before WSL starts.
      - name: Keep WSL running while idle
        run: Set-Content "$env:USERPROFILE\.wslconfig" "[general]`ninstanceIdleTimeout=-1"

      # mingw lets seed.sh build the Windows samples as real programs.
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: docker.io docker-compose-v2 zip curl gcc-mingw-w64-x86-64

      # WSL hands the server's port on to Windows: the tests reach it at the
      # same address as on Linux.
      - name: Start the test server
        shell: wsl-bash {0}
        run: ./dev/seed.sh

      # Edge's WebDriver attaches to the app's WebView2 through a debug port,
      # which WebView2 only opens here when a machine policy asks for it: it
      # ignores the environment variable and per-user policy in an elevated
      # process, and everything on this runner is elevated. bun.exe hosts the
      # app's webview; the port is DEBUG_PORT in e2e/windows.ts.
      - name: Let the app's WebView2 open a debug port
        run: |
          $key = "HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          New-Item -Force $key | Out-Null
          New-ItemProperty -Force -Path $key -Name bun.exe -Value "--remote-debugging-port=9222" | Out-Null

      # Single sign-on opens the system's web browser. Here that is curl, which
      # follows the server's redirects as a browser would: the test server's
      # identity provider signs the test account in by itself. A browser the
      # account chose itself would come first; the log shows if there is one.
      - name: Make curl the web browser
        run: |
          $key = "HKCU:\Software\Classes\http\shell\open\command"
          New-Item -Force $key | Out-Null
          Set-Item $key -Value "`"$env:SystemRoot\System32\curl.exe`" -fsSL -b `"`" -o NUL `"%1`""
          Get-ItemProperty -ErrorAction SilentlyContinue "HKCU:\Software\Microsoft\Windows\Shell\Associations\UrlAssociations\http\UserChoice" | Select-Object ProgId

      - name: Install Hutch
        run: |
          & ([scriptblock]::Create((irm https://hutch.blackboard.sh/hutch/install.ps1))) -Version $env:HUTCH_VERSION -NoModifyPath
          Join-Path $HOME ".hutch\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install dependencies
        run: hutch run install

      - name: Build the app
        run: hutch run build:dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the tests' packages
        working-directory: e2e
        run: npm ci

      - name: Run the tests
        working-directory: e2e
        run: |
          $env:STAULT_APP = (Resolve-Path ../build/dev-*/*/bin/launcher.exe).Path
          npm test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failures-windows
          path: e2e/failures/
          if-no-files-found: ignore
          retention-days: 14
